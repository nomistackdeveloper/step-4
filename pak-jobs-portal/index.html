<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakistan Jobs & Schemes Portal | Official Government Notifications</title>
  
  <!-- Meta Tags for SEO -->
  <meta name="description" content="Find latest Federal & Provincial Government Jobs in Pakistan, PPSC, FPSC, NTS, Army Jobs, PM Youth Schemes, and Scholarships.">
  <meta name="keywords" content="Govt Jobs Pakistan, PPSC Jobs, FPSC Jobs, NTS Jobs, PM Youth Loan Scheme, BISP">
  
  <!-- Tailwind CSS & Custom Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .font-urdu {
      font-family: 'Noto Nastaliq Urdu', serif;
      line-height: 2.2;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-gray-100 text-gray-800 pb-20 md:pb-0 flex flex-col min-h-screen">

  <!-- DYNAMIC SHARED HEADER CONTAINER -->
  <header id="main-header" class="sticky top-0 z-50 shadow-md bg-emerald-900 text-white"></header>

  <!-- MAIN APP ROUTER CONTAINER -->
  <main id="app-content" class="flex-grow max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 space-y-6">
    <!-- Initial Loading State -->
    <div id="loading-spinner" class="text-center py-16">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-700 border-t-transparent"></div>
      <p class="text-sm text-gray-500 mt-3 font-medium">Loading Jobs & Schemes Portal...</p>
    </div>
  </main>

  <!-- DYNAMIC SHARED FOOTER CONTAINER -->
  <footer id="main-footer" class="bg-gray-900 text-gray-300 mt-10 border-t border-gray-800"></footer>

  <!-- MOBILE STICKY BOTTOM NAV BAR -->
  <div id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-xs font-semibold text-gray-600 z-50 shadow-lg">
    <button onclick="router('home')" class="flex flex-col items-center gap-1 text-emerald-800">
      <span class="text-lg">🏠</span>
      <span>Home</span>
    </button>
    <button onclick="filterCategory('jobs')" class="flex flex-col items-center gap-1">
      <span class="text-lg">💼</span>
      <span>Jobs</span>
    </button>
    <button onclick="filterCategory('Schemes')" class="flex flex-col items-center gap-1">
      <span class="text-lg">🎁</span>
      <span>Schemes</span>
    </button>
    <button onclick="openSearchModal()" class="flex flex-col items-center gap-1">
      <span class="text-lg">🔍</span>
      <span>Search</span>
    </button>
  </div>

  <!-- INTERACTIVE SEARCH MODAL WITH EDUCATION FILTER -->
  <div id="search-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-start justify-center pt-10 px-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-xl rounded-3xl p-5 shadow-2xl border border-gray-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-gray-900 text-base">🔍 Search & Filter Jobs</h3>
        <button onclick="closeSearchModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-1 rounded-full text-xs">✕ Close</button>
      </div>

      <div class="space-y-3">
        <!-- Search Input & Qualification Dropdown Row -->
        <div class="flex flex-col sm:flex-row gap-2">
          <div class="relative flex-grow">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">🔍</span>
            <input type="text" id="modal-search-input" placeholder="Search title or dept (e.g. PPSC, Solar)..." class="w-full text-xs sm:text-sm pl-10 pr-3 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:border-emerald-600 transition" oninput="triggerModalSearch()">
          </div>

          <select id="modal-qual-filter" class="text-xs sm:text-sm p-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:border-emerald-600 font-medium text-gray-700 cursor-pointer" onchange="triggerModalSearch()">
            <option value="All">🎓 All Qualifications</option>
            <option value="Matric">Matric / Below</option>
            <option value="Intermediate">Intermediate (FA/FSc/IT)</option>
            <option value="Graduation">Graduation / Bachelor</option>
            <option value="Master">Master Degree</option>
          </select>
        </div>

        <!-- Trending Tags -->
        <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar py-1">
          <span class="text-[10px] font-bold text-gray-400 uppercase whitespace-nowrap">Trending:</span>
          <button onclick="applyModalSuggestion('PPSC')" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-xl border border-emerald-200 whitespace-nowrap">🔥 PPSC</button>
          <button onclick="applyModalSuggestion('Solar')" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-xl border border-emerald-200 whitespace-nowrap">⚡ Solar</button>
          <button onclick="applyModalSuggestion('E-Bike')" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-xl border border-emerald-200 whitespace-nowrap">🏍️ E-Bike</button>
          <button onclick="applyModalSuggestion('BISP')" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-xl border border-emerald-200 whitespace-nowrap">💰 BISP</button>
        </div>
      </div>

      <div id="modal-search-results" class="max-h-64 overflow-y-auto space-y-2 pt-2 divide-y divide-gray-100">
        <p class="text-xs text-gray-400 text-center py-4">Start typing or select qualification above...</p>
      </div>
    </div>
  </div>

  <!-- LINKED EXTERNAL JAVASCRIPT -->
  <script src="assets/js/app.js"></script>
</body>
</html>
